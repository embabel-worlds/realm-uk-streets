# tests/questions.yml — the natural-language battery (realm-spec README, `tests/`).
#
# The questions a person actually types at this realm, with what a correct answer
# must satisfy. Run by tests/verify.sh through the ask surface. `matchesView` is the
# assertion for FIGURES: the ask's top-row number must equal the named view's — the
# realm reconciling against itself, so the test survives data changes. `nonEmpty` /
# `minRows` are the floor where a windowed or judged answer has no stable reference.
#
# Add every question that ever disappointed a user; each becomes a permanent
# regression test. (The adversarial fabrication battery — questions the DATA cannot
# answer, which once produced confidently-wrong queries — lives in verify.sh itself,
# because its assertion is about the generated query's honesty, not a figure.)

- question: "which of my places is the safest"
  expect:
    matchesView: { name: SafestPlace, column: perThousandResidents }
- question: "where is crime lowest among my watched places"
  expect:
    matchesView: { name: SafestPlace, column: perThousandResidents }
- question: "what is the most signed petition to parliament right now"
  expect:
    # withinPct: signatures are a LIVE counter, and the ask's fetch and the view's ride
    # different producer-cache entries — readings minutes apart. Half a percent covers it.
    matchesView: { name: WhatBritainSigns, column: signatures, withinPct: 0.5 }
- question: "which of my places has the most schools nearby"
  expect:
    matchesView: { name: SchoolsNearMyPlaces, column: schools }
- question: "which of my places sits in the most marginal seat"
  expect:
    matchesView: { name: SeatsAndMargins, column: majority }
- question: "who are the MPs for my places"
  expect: { minRows: 2 }
- question: "how many places am I watching"
  expect:
    # countOfView: the answer's figure must equal the named view's ROW COUNT — the count
    # form reconciling against the list form. (nonEmpty once passed 72 dumped config
    # records as an answer to this question.)
    countOfView: MyPlaces
- question: "list the places I am watching"
  expect: { minRows: 2 }
- question: "what do homes actually sell for near my places"
  expect: { nonEmpty: true }
- question: "which streets around my places have the most crime"
  expect: { nonEmpty: true }
- question: "what are people in my seats petitioning about"
  expect: { nonEmpty: true }
- question: "which of my places' districts has the highest median pay"
  expect:
    matchesView: { name: PayAtMyPlaces, column: annualPay }
- question: "where do people earn the most among my places"
  expect:
    matchesView: { name: PayAtMyPlaces, column: annualPay }
- question: "how do crime and income relate across my districts"
  expect: { nonEmpty: true }
- question: "which constituencies have the highest pay"
  expect:
    matchesView: { name: PayAcrossConstituencies, column: annualPay }
- question: "does what a seat earns predict what it petitions parliament for"
  # The cross-source answer (PayVsPetitionSigning): one row per live petition,
  # each carrying a correlation object rather than a bare figure, so the floor is
  # a non-empty result — the correctness of the numbers is verify.sh's join check.
  expect: { minRows: 5 }
- question: "which seats sign hardest for banning school attendance fines, and what do they earn"
  expect: { nonEmpty: true }
- question: "what best predicts crime — deprivation, density, age or ethnic mix"
  expect: { nonEmpty: true }
- question: "what best predicts crime across the country — income, density or age"
  # WhatBestPredictsCrime: one model row, structured cells (betas, residual
  # outliers), so the floor is a non-empty fit.
  expect: { nonEmpty: true }
- question: "what are the best predictors of crime in a constituency, use linear algebra"
  # The one statistical answer (WhatTracksDistrictCrime): a least-squares model row.
  # Its cells are structured (betas, residual outliers), so figure reconciliation
  # cannot apply — the floor is a non-empty model, and the adversarial pass holds the
  # same question to the fabrication invariants across repeated runs.
  expect: { nonEmpty: true }

# ── The community and organisation axes (2026-09-25) ────────────────────────
- question: "how many children live in Blackpool"
  expect:
    matchesView: { name: PlaceProfile, column: children0to15, args: { place: Blackpool } }
- question: "profile Blackpool"
  expect: { nonEmpty: true }
- question: "what stands out about Blackpool compared to England"
  expect: { minRows: 5 }
- question: "how has school readiness in Blackpool changed"
  expect:
    matchesView: { name: SchoolReadinessAtPlace, column: goodLevelOfDevelopmentPct, args: { place: Blackpool } }
- question: "which councils have the highest share of children in low income families"
  expect:
    matchesView: { name: IndicatorAcrossEngland, column: value, args: { indicatorId: "93701" } }
- question: "which are the most deprived districts in England on the 2025 index"
  expect:
    matchesView: { name: MostDeprivedDistricts2025, column: averageScore, args: { by: average } }
- question: "who funds Blackpool"
  expect:
    matchesView: { name: WhoFundsThisPlace, column: totalAwarded, args: { place: Blackpool } }
- question: "how much grant money came into Blackpool each year since 2019"
  expect:
    matchesView: { name: GrantsIntoPlaceByYear, column: totalAwarded, args: { place: Blackpool, fromYear: "2019" } }
- question: "which charities operate in Middlesbrough"
  expect: { minRows: 10 }
- question: "which charities in Blackpool have been removed from the register since 2025"
  expect: { nonEmpty: true }
- question: "what is the claimant count in Middlesbrough"
  expect:
    matchesView: { name: PlaceProfile, column: claimants, args: { place: Middlesbrough } }

