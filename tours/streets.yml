# The walk through what this realm added — shipped WITH the realm, so it arrives when the realm is
# installed and leaves when it is removed.
#
# IT SHOWS THE APP, NOT JUST THE QUERIES. An earlier draft was five view runs in a row: every step
# landed on the Views tab, so a tour of a realm whose centrepiece is a MAP never showed the map.
# That is the realm's product; the views are how you interrogate it afterwards. So the map comes
# first, the user clicks a dot themselves, and only then does the same dossier appear as a table —
# which is the point worth making, that the app and the query are the same data seen twice.
#
# TWO HALVES, because this realm has two and a newcomer meets the wrong one first: everything
# national answers on a world with nothing watched, and nothing street-level answers at all until a
# UkPlace exists. Opening on PlaceDossier would show an empty table and teach a new user that the
# realm is broken.

- id: StreetLensFirstLook
  name: Street Lens, first look
  description: >-
    Eleven official UK sources joined at a place. The national picture, then the map, then your
    own street as data you can query.

  steps:
    - say: |
        Eleven official sources — crime, property sales, pay, census, schools, floods, your MP.
        **The geography is the join.** Watch.

    - run: view.DistrictCrimeLeague
      say: |
        Every district in England & Wales, ranked by recorded crime per 1,000 residents. **Live,
        from the ONS table.**

    - say: |
        Westminster leads it partly *by construction* — crime is counted where it happens, residents
        where they live. Anywhere with a big daytime population looks worse than it lives.

    - say: |
        That is the national half, and it is a table. The realm's real subject is a **place** — so
        here is what that looks like.

    # THE MAP. Everything above this is the setup for it.
    - open: app.street-lens
      say: |
        **Street Lens.** Britain drawn from a vendored outline — no tiles, nothing fetched from
        anybody else. Each dot is a place you watch.

    - open: app.street-lens
      by: user
      hint: >-
        Click a dot — or search a postcode to add one. The dossier is built live, from ten APIs,
        the moment you click. Press Done when you have looked.

    - say: |
        Everything in that dossier is a **live join**: the MP from Parliament's own record, the pay
        from ONS, the sales from the Land Registry, the crime from the police. Nothing was copied
        into a database and nothing is stale.

    - run: view.PlaceDossier
      say: |
        And here is the same dossier as **data you can query** — one row per place. The app and the
        view are the same join, seen twice: one to look at, one to ask questions of.

    - run: view.SafestPlace
      say: |
        Ranked by **rate**, not count — a field has no crime because it has no people.

    - say: |
        A zero can be coverage, not calm: no Scotland, no Greater Manchester in street crime.

        From here, **Views** has the rest — `CrimeVsIncome`, `SeatsAndMargins`, `IncomeByParty`,
        `PriceTrendAtMyPlaces`, `WhereNotToEat`. Each one is a question no single register answers.
