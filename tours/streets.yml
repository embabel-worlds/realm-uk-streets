# The walk through what this realm added — shipped WITH the realm, so it arrives when the realm is
# installed and leaves when it is removed.
#
# IT DRIVES THE CONSOLE; IT DOES NOT DESCRIBE IT. Every `run:` navigates to Views, picks the view
# and runs it in the panel where somebody would look for it tomorrow, so the user watches the app
# work rather than reading about it. The captions are short by design: they are subtitles over
# something moving, and a paragraph makes the reader stop watching. The first draft of this file
# was nine steps of prose with tables beside it, which is a document, and a document is what the
# `how-it-works` page is for.
#
# TWO HALVES, because this realm has two and a newcomer meets the wrong one first: everything
# national answers on a world with nothing watched, and nothing street-level answers at all until a
# UkPlace exists. Opening on PlaceDossier would show an empty table and teach a new user that the
# realm is broken.
#
# It names no panel except `apps`, which both surfaces publish, and `run:` resolves against the
# world rather than the layout — so this runs in the Me app and the Worlds console alike.

- id: StreetLensFirstLook
  name: Street Lens, first look
  description: >-
    Eleven official UK sources joined at a place. Watch the console pull the national picture,
    then your own street.

  steps:
    - say: |
        Eleven official sources — crime, property sales, pay, census, schools, floods, your MP.
        **The geography is the join.** Watch.

    - run: view.DistrictCrimeLeague
      say: |
        Every district in England & Wales, ranked by recorded crime per 1,000 residents. **Live,
        from the ONS table.**

    - say: |
        Westminster leads it partly *by construction* — crime is counted where it happens, residents
        where they live. Anywhere with a big daytime population looks worse than it lives.

    - run: view.CrimeVsIncomeAcrossDistricts
      say: |
        The same crime figures, now beside each district's median pay. ~290 districts, poorest
        first. **No single register serves this join.**

    - say: |
        Association across areas — never causation, and never a claim about anyone who lives there.

    - say: |
        That is the national half. The realm's real subject is one postcode: **yours.**

    - open: panel.apps
      by: user
      hint: >-
        Open Street Lens and add a postcode — then press Done. (Already watching places? Press Skip.)
      # A row means places already exist, so a returning user is walked straight past the asking.
      doneWhen: |
        MATCH (p:UkPlace) RETURN p LIMIT 1

    - run: view.PlaceDossier
      say: |
        Every place you watch, in one row: crime, income, house price, ethnicity, MP, majority.
        **Ten APIs behind this, cached at each source's own cadence.**

    - run: view.SafestPlace
      say: |
        Ranked by **rate**, not count — a field has no crime because it has no people.

    - run: view.CrimeVsIncome
      say: |
        Your streets on the affluence-and-safety scatter. The national picture, at the scale you
        live at.

    - say: |
        A zero can be coverage, not calm: no Scotland, no Greater Manchester in street crime.

        Everything you just watched is a saved view — **Views**, any time. `SeatsAndMargins`,
        `IncomeByParty`, `PriceTrendAtMyPlaces`, `WhereNotToEat` are next.
