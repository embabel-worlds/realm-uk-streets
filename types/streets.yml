# One persisted anchor and one virtual decoration — the realm-weather posture:
# the set of places is small, hand-curated and the user's own, so it belongs in
# the graph; the crimes around each place are a large, monthly-changing
# external collection, so they are fetched per query and gone at rollback.

# A place in the United Kingdom the user is watching. Coordinates are stored ON
# the place, resolved once via `gateway.postcodesIo.lookupPostcode` (or
# `searchPlaces`) when it is added — the same reasoning as WeatherLocation:
# every downstream surface is keyed on the pair, so resolve once, store, reuse.
- name: UkPlace
  description: "A UK place the user is watching, with coordinates already resolved from its postcode so crime, weather and air lookups need no further geocoding."
  properties:
    name:
      type: string
      description: "How the user refers to the place, e.g. 'Shoreditch' or 'Mum's street'. Shown as the headline."
    postcode:
      type: string
      description: "The postcode it was resolved from, e.g. SW1A 1AA."
    latitude:
      type: number
      description: "Latitude in decimal degrees, from postcodes.io."
    longitude:
      type: number
      description: "Longitude in decimal degrees, from postcodes.io."
    district:
      type: string
      description: "Local authority district, e.g. 'Hackney'."
    region:
      type: string
      description: "Region or country within the UK, e.g. 'London', 'Wales'."
    notes:
      type: string
      description: "Why the user watches this place — free text, optional."
    level:
      type: string
      description: "'postcode' for a full postcode (SE10 9JY), 'outcode' for a district-level watch (SE10) — the two zoom levels of the search."
    outcode:
      type: string
      description: "The outward code, e.g. SE10 — shared by both levels."
    lsoa:
      type: string
      description: "GSS code of the LSOA (E01…) — the neighbourhood key census data joins on. Absent at outcode level."
    lsoaName:
      type: string
      description: "The LSOA's human name, e.g. 'Greenwich 038B'."
    districtCode:
      type: string
      description: "GSS code of the local authority (E09…/E06…) — the key income data joins on."
    districtSlug:
      type: string
      description: "The local authority as a lowercase slug (greenwich, tower-hamlets) — the key the House Price Index joins on."
    ward:
      type: string
      description: "Electoral ward name."
    constituency:
      type: string
      description: "Parliamentary constituency name — the key the seat join uses."
    constituencyCode:
      type: string
      description: "ONS constituency code (E14…) — the key petition signature maps join on."
    latlon:
      type: string
      description: "The pair as one string, 'lat,lon' — a convenience key for query templates."
    wkt:
      type: string
      description: "The pair as a WKT point, 'Point(lon lat)' — the key SPARQL radius joins centre on (schools)."

# A police-recorded crime near a watched place — VIRTUAL, one month deep.
#   Which of my places is safest?
#     MATCH (p:UkPlace) OPTIONAL MATCH (p)-[:HAS_CRIME]->(c:CrimeIncident)
#     RETURN p.name, count(c) AS incidents ORDER BY incidents ASC
- name: CrimeIncident
  description: "A police-recorded street-level crime within one mile of a watched UkPlace, latest published month, from data.police.uk. Reached via HAS_CRIME. Street names are anonymised localities ('On or near Shopping Area'), not addresses; outcome is absent while under investigation. Coverage: England, Wales, NI — but NOT Scotland, and NOT Greater Manchester (GMP stopped publishing street-level data in 2019 after its records-system failure). A low count in those areas is a coverage fact, not calm."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_CRIME
      producerKeyFields: [latitude, longitude]
      recordKeyField: key
      producer: streetCrimes
      maxAnchors: 15
      description: "All recorded crimes within a mile of the place, latest month — city centres return THOUSANDS of rows per place, hence maxAnchors. Aggregate (count by category/street) rather than listing raw incidents."
  properties:
    id:
      description: "police.uk incident id. Identity — the same incident near two watched places is one node with two HAS_CRIME edges."
      metadata:
        identity: "true"
    key: "The coordinate pair whose 1-mile radius found this incident — the join link, not the incident's location."
    category: "Crime category slug: violent-crime, anti-social-behaviour, burglary, vehicle-crime, shoplifting, robbery, drugs, criminal-damage-arson, public-order, theft-from-the-person, bicycle-theft, other-theft, possession-of-weapons, other-crime."
    month: "The month the incident was recorded, YYYY-MM."
    street: "Anonymised street-level locality, e.g. 'On or near Petticoat Lane'."
    outcome: "Latest outcome category, e.g. 'Investigation complete; no suspect identified' — absent while under investigation."
    crimeLat: "Anonymised snap-point latitude — approximate by design."
    crimeLon: "Anonymised snap-point longitude — approximate by design."

# ── The postcode axis ────────────────────────────────────────────────────────
# A registered sale at the place's postcode — every sale since 1995, so this is
# the street's actual market history, not an estimate.
- name: PropertySale
  description: "A registered property sale at a watched place's postcode, from HM Land Registry Price Paid Data — actual prices paid since 1995, newest first, up to 30 per place. Reached via HAS_SALE. Absent at outcode-level places (sales are keyed on full postcodes)."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_SALE
      keyField: postcode
      recordKeyField: key
      producer: priceHistory
      maxAnchors: 15
      description: "Sales recorded at the place's exact postcode — for 'what do homes actually go for here', ORDER BY toFloat(s.price) or take the newest rows."
  properties:
    id:
      description: "Land Registry transaction URI. Identity."
      metadata:
        identity: "true"
    key: "The postcode the sale was found at — the join link."
    price:
      type: number
      description: "Price paid, GBP — the real figure from the register, not an estimate."
    date: "Transaction date, display string, already newest-first from the source."
    paon: "Primary addressable object — usually the house number."
    street: "Street name, uppercase as registered."
    town: "Town as registered."
    propertyType: "detached / semi-detached / terraced / flat-maisonette / other."
    estate: "Freehold or Leasehold."
    newBuild: "true when the sale was a new build."

# The district's official House Price Index — a monthly average-price series.
- name: AreaHousePrice
  description: "One month of the UK House Price Index for a watched place's local authority — official average prices by property type. Reached via HAS_HOUSE_PRICES; 13 months per place, newest first, so month-on-year change is computable in Cypher."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_HOUSE_PRICES
      keyField: districtSlug
      recordKeyField: key
      producer: areaHousePrices
      maxAnchors: 15
      description: "The district's monthly price index — for 'what's the average price around X and which way is it moving'."
  properties:
    id:
      description: "Source URI of the month's index row. Identity."
      metadata:
        identity: "true"
    key: "The district slug the series belongs to — the join link."
    month: "The index month."
    averagePrice:
      type: number
      description: "Average price across all property types, GBP."
    detached:
      type: number
      description: "Average detached price, GBP."
    terraced:
      type: number
      description: "Average terraced price, GBP."
    flat:
      type: number
      description: "Average flat/maisonette price, GBP."
    index:
      type: number
      description: "The index value (Jan 2015 = 100)."

# ── The district axis ────────────────────────────────────────────────────────
- name: AreaIncome
  description: "Median gross ANNUAL pay for full-time workers in a watched place's local authority, from ONS ASHE. One row per place, reached via HAS_INCOME. District-level: it describes where the place is, not the person next door."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_INCOME
      keyField: districtCode
      recordKeyField: key
      producer: medianPay
      maxAnchors: 15
      description: "The district's median full-time annual pay — the income half of 'crime level vs income around my places'."
  properties:
    id:
      description: "NOMIS observation URN. Identity."
      metadata:
        identity: "true"
    key: "The district GSS code — the join link."
    annualPay:
      type: number
      description: "Median gross annual pay, GBP, full-time workers."
    area: "The district's name as ONS states it."
    year: "The ASHE reference year."

# ── The neighbourhood (LSOA) axis ────────────────────────────────────────────
- name: EthnicGroupShare
  description: "One ethnic group's share of residents in a watched place's immediate neighbourhood (LSOA), Census 2021 — five top-level groups per place, percentages. Reached via HAS_ETHNICITY. Absent at outcode level."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_ETHNICITY
      keyField: lsoa
      recordKeyField: key
      producer: censusEthnicity
      maxAnchors: 15
      description: "The neighbourhood's census composition — five rows per place, one per group."
  properties:
    id:
      description: "NOMIS observation URN — unique per area and group. Identity."
      metadata:
        identity: "true"
    key: "The LSOA GSS code — the join link."
    group: "The census group, e.g. 'Asian, Asian British or Asian Welsh'."
    percent:
      type: number
      description: "Percent of the neighbourhood's residents, Census 2021."
    area: "The LSOA name."

# ── The coordinate axis ──────────────────────────────────────────────────────
- name: FoodPlace
  description: "An inspected food business within a mile of a watched place, with its official hygiene rating. Reached via HAS_FOOD. RatingValue is a STRING — '0'-'5' but also 'AwaitingInspection'/'Exempt' — guard before toFloat()."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_FOOD
      producerKeyFields: [latitude, longitude]
      recordKeyField: key
      producer: foodHygiene
      maxAnchors: 15
      description: "The 30 nearest inspected food businesses — for 'anywhere I shouldn't eat near X', filter rating IN ['0','1','2']."
  properties:
    fhrsId:
      description: "FSA establishment id. Identity — the same restaurant near two places is one node."
      metadata:
        identity: "true"
    key: "The coordinate pair that found it — the join link."
    name: "The business's name."
    businessType: "Restaurant/Cafe/Canteen, Takeaway, School, Pub…"
    rating: "The official rating: '5' (best) to '0', or 'AwaitingInspection'/'Exempt'."
    ratedOn: "When it was last inspected."
    distanceMiles:
      type: number
      description: "Distance from the place, miles."

- name: FloodAlert
  description: "A LIVE Environment Agency flood alert within 15 km of a watched place (England only). Reached via HAS_FLOOD_ALERT; empty is the normal, good answer. severityLevel: LOWER is WORSE (1 severe, 2 warning, 3 alert)."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_FLOOD_ALERT
      producerKeyFields: [latitude, longitude]
      recordKeyField: key
      producer: floodWarnings
      maxAnchors: 15
      description: "Active flood alerts near the place, live (10-minute cache)."
  properties:
    key: "The coordinate pair searched — the join link."
    severity: "'Flood alert', 'Flood warning' or 'Severe flood warning'."
    severityLevel: "1 severe, 2 warning, 3 alert — lower is worse."
    area: "The area the alert covers."
    raisedAt: "When it was raised."

# ── The constituency axis ────────────────────────────────────────────────────
- name: Seat
  description: "The parliamentary seat covering a watched place: current MP, party and the party's brand colour. Reached via HAS_SEAT. The seat then anchors ITS OWN join — (:Seat)-[:HAS_RESULT]->(:SeatResult) — for the margin."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_SEAT
      keyField: constituency
      recordKeyField: key
      producer: mpForSeat
      maxAnchors: 15
      description: "The place's MP and party — join through to HAS_RESULT for majority and turnout."
  properties:
    seatId:
      description: "Parliament's constituency id. Identity — two places in one seat share the node — and the key HAS_RESULT joins on."
      metadata:
        identity: "true"
    key: "The constituency name searched — the join link."
    seat: "The constituency's official name."
    mp: "The sitting MP's display name."
    party: "The MP's party."
    partyAbbrev: "Lab, Con, LD, RUK…"
    partyColour: "The party's brand colour as a hex string, straight from Parliament."

# A virtual node anchoring a virtual join: the Seat's latest election result.
- name: SeatResult
  description: "The seat's latest general-election result: winner, majority, electorate, turnout. Reached from Seat via HAS_RESULT — so 'my places, their MPs, and how safe each seat is' is a two-hop MATCH."
  virtualJoins:
    - anchorLabel: Seat
      relationship: HAS_RESULT
      keyField: seatId
      recordKeyField: key
      producer: seatResult
      maxAnchors: 15
      description: "Majority and turnout for the seat — the margin half of 'which of my places is in a marginal'."
  properties:
    key:
      description: "The seat id — the join link, and the identity: one latest result per seat."
      metadata:
        identity: "true"
    result: "'Lab Hold', 'Con Gain'…"
    majority:
      type: number
      description: "Votes between first and second place."
    electorate:
      type: number
      description: "Registered electors."
    turnout:
      type: number
      description: "Votes cast."
    winningParty: "The winning party's name."

# A school near a watched place, from OpenStreetMap — names and positions, not
# ratings: Ofsted publishes judgements as downloads, not an API, so this realm
# reports what is THERE and never grades it.
- name: School
  description: "A school within ~1.5 km of a watched place, from Wikidata (Q3914 and subclasses). Reached via HAS_SCHOOL. Coverage tracks Wikidata: real schools can be absent, so a low count means poorly-mapped, not school-less. No ratings: Ofsted publishes judgements as downloads, not an API."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_SCHOOL
      keyField: wkt
      recordKeyField: key
      producer: schoolsNear
      maxAnchors: 15
      description: "Schools within 1.5 km — for 'how many schools are near X', count; unnamed OSM entries are real but anonymous, so count all and name the named."
  properties:
    id:
      description: "Wikidata entity id (Q…). Identity."
      metadata:
        identity: "true"
    key: "The WKT point searched — the join link."
    name: "The school's English label on Wikidata."
    schoolLat: "The school's latitude."
    schoolLon: "The school's longitude."

# A month of crime near a watched place — the TREND axis. Twelve months deep,
# raw incidents stamped with their month; the views aggregate. The first read
# of a place's history costs twelve paced calls; every read after that costs
# only the newest month (closed months never re-fetch).
- name: CrimeMonthIncident
  description: "A police-recorded incident near a watched place within one of the last 12 published months, month-stamped — the raw material of crime trends. Reached via HAS_CRIME_HISTORY; aggregate by month, never enumerate. Coverage as CrimeIncident: no Scotland, no Greater Manchester."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_CRIME_HISTORY
      producerKeyFields: [latitude, longitude]
      recordKeyField: key
      producer: crimeMonths
      maxAnchors: 15
      description: "Twelve months of incidents within a mile — for 'is crime rising here', count per month and compare ends. COLD COST is places x 12 calls; prefer the fill driver for the first read."
  properties:
    id:
      description: "police.uk incident id. Identity."
      metadata:
        identity: "true"
    key: "The coordinate pair whose radius found it — the join link."
    month: "The month the incident belongs to, YYYY-MM — the period stamp."
    category: "Crime category slug."
    street: "Anonymised street-level locality."


# The neighbourhood's population density — the honest denominator for radius
# counts. A raw "crimes within a mile" rewards emptiness: 300 incidents in a
# packed city centre is SAFER per person than 300 on a quiet coast. The rate
# assumes the LSOA's density holds across the mile — say so when presenting.
- name: AreaDensity
  description: "Census 2021 population density (persons per square km) of a watched place's immediate neighbourhood (LSOA). Reached via HAS_DENSITY. The denominator for crime rates: estimated residents within the 1-mile circle = density x 8.14 km². Absent at outcode level."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_DENSITY
      keyField: lsoa
      recordKeyField: key
      producer: densityLsoa
      maxAnchors: 15
      description: "The neighbourhood's density — multiply by 8.14 (the 1-mile circle's area in km²) for estimated residents in crime-radius comparisons."
  properties:
    id:
      description: "NOMIS observation URN. Identity."
      metadata:
        identity: "true"
    key: "The LSOA GSS code — the join link."
    density:
      type: number
      description: "Usual residents per square kilometre, Census 2021."
    area: "The LSOA name."


# ── The official district crime table (ONS/Home Office, Table C5) ────────────
# UkDistricts is a LITERAL-SEEDED anchor — MATCH (u:UkDistricts
# {set:'england-and-wales'}) mints it per query; nothing is stored. It exists
# so the WHOLE country's crime table (and every district's median pay) hangs
# off one anchor for cross-district analysis.
- name: DistrictCrime
  description: "One area's official police-recorded crime RATES per 1,000 population for headline offence groups, year ending March 2024 (ONS Community Safety Partnership tables). Reached two ways: (p:UkPlace)-[:HAS_DISTRICT_CRIME]->(c) for a watched place's district, or nationally via MATCH (u:UkDistricts {set:'england-and-wales'})-[:LISTS_CRIME]->(c) for all ~300 districts at once. National rows include force-area subtotals and combined-CSP rows with no real code — filter districtCode =~ '^[EW]0.*' before ranking. Rates are the publisher's own population correction, so they rank directly; a suppressed cell ('[u1]', e.g. City of London) reads as null through toFloat(). Westminster's rate is inflated by its daytime population — crimes are counted where they happen, residents where they live."
  virtualJoins:
    - anchorLabel: UkPlace
      relationship: HAS_DISTRICT_CRIME
      keyField: districtCode
      recordKeyField: key
      producer: districtCrimeRates
      maxAnchors: 12
      description: "The watched place's district in the official table — usually one row; a merged authority (Buckinghamshire, East Suffolk) carries one row per legacy CSP sub-area. A district folded into a combined CSP (parts of Devon, Kent, Worcestershire) has no individual row."
    - anchorLabel: UkDistricts
      relationship: LISTS_CRIME
      keyField: set
      recordKeyField: key
      producer: districtCrimeTable
      maxAnchors: 1
      description: "Every row of the national table under one literal-seeded anchor — one cached file read, ~400 transient rows."
  properties:
    id:
      description: "Synthesized per-row id (key:ordinal), deterministic per file edition. Identity."
      metadata:
        identity: "true"
    key: "The join key that produced the row — the district code (from a place) or the anchor set literal (from the national table)."
    districtCode: "Local authority GSS code (E06/E07/E08/E09/W06) — equals UkPlace.districtCode. Force subtotals and combined-CSP rows carry text here instead; filter =~ '^[EW]0.*' for real districts."
    district: "Local authority name."
    csp: "Community Safety Partnership name — the police-side area; distinct from the LA name where authorities merged."
    force: "Police force area name."
    population:
      type: number
      description: "Mid-2022 population, rounded to 100 — the denominator behind the rates."
    households:
      type: number
      description: "Mid-2021 households, rounded to 100."
    totalRate:
      type: number
      description: "Total recorded crime (excluding fraud) per 1,000 population — the headline rate."
    violenceRate:
      type: number
      description: "Violence against the person, per 1,000 population."
    violenceInjuryRate:
      type: number
      description: "Violence with injury, per 1,000 population."
    stalkingRate:
      type: number
      description: "Stalking and harassment, per 1,000 population."
    sexualRate:
      type: number
      description: "Sexual offences, per 1,000 population."
    robberyRate:
      type: number
      description: "Robbery, per 1,000 population."
    theftRate:
      type: number
      description: "All theft offences, per 1,000 population."
    burglaryRate:
      type: number
      description: "Burglary, per 1,000 population."
    vehicleRate:
      type: number
      description: "Vehicle offences, per 1,000 population."
    theftFromPersonRate:
      type: number
      description: "Theft from the person, per 1,000 population."
    bikeTheftRate:
      type: number
      description: "Bicycle theft, per 1,000 population."
    shopliftingRate:
      type: number
      description: "Shoplifting, per 1,000 population."
    criminalDamageRate:
      type: number
      description: "Criminal damage and arson, per 1,000 population."
    drugRate:
      type: number
      description: "Drug offences, per 1,000 population."
    weaponsRate:
      type: number
      description: "Possession of weapons offences, per 1,000 population."
    publicOrderRate:
      type: number
      description: "Public order offences, per 1,000 population."

# Every district's median pay in one NOMIS call — the income axis of the
# cross-district views, so crime-vs-income never costs 300 keyed calls.
- name: DistrictIncome
  description: "Median gross annual pay (ASHE, full-time) for one local authority, from the all-districts NOMIS batch. Reached via MATCH (u:UkDistricts {set:'england-and-wales'})-[:HAS_PAY]->(i) — one call returns every district; join to DistrictCrime rows on matching districtCode. The NOMIS geography set is a 2021 vintage: post-2023 unitaries (Buckinghamshire, North Yorkshire, Somerset) are absent, and their crime rows simply find no pay row."
  virtualJoins:
    - anchorLabel: UkDistricts
      relationship: HAS_PAY
      keyField: set
      recordKeyField: key
      producer: medianPayAllDistricts
      maxAnchors: 1
      description: "All ~370 district pay medians in one NOMIS call, a week of cache."
  properties:
    id:
      description: "NOMIS observation URN. Identity."
      metadata:
        identity: "true"
    key: "The anchor set literal — the join link."
    districtCode: "Local authority GSS code — equals DistrictCrime.districtCode and UkPlace.districtCode."
    area: "The district's name as NOMIS styles it."
    annualPay:
      type: number
      description: "Median gross ANNUAL pay in GBP, full-time jobs held in the district."
    year: "The ASHE year the figure belongs to."
