# ENGINE GATE: everything in THIS file needs `periods:` support (me >= 2026-08-27).
# It lives apart from producers/streets.yml deliberately: a loader that predates the
# feature rejects a whole file on the first unknown field, and the trend producer must
# never take crime, prices, income and the census down with it. On an older engine
# only CrimeTrend degrades — with an "Unknown producer" that names exactly one thing.

# TWELVE MONTHS of crime per place — the trend axis (`periods:`, realm-spec
# §5.17). One call per (place, month), paced at the source's one-a-second;
# a CLOSED month is immutable and caches effectively forever, so the cold
# fill is paid once — drive it with a fill (§9.1) rather than one long query.
# lag: 2 because police.uk publishes one to two months in arrears.
- name: crimeMonths
  kind: remote
  operation: streetCrimes
  records: "$[*]"
  keyArgs: [lat, lng]
  echoKeyAs: key
  maxKeysPerCall: 1
  cost: { rate: "1/second" }
  periods: { param: date, unit: month, count: 12, lag: 2, stampAs: month }
  project:
    id: id
    category: category
    street: location.street.name
  cache: { kind: ttl, seconds: 21600 }

