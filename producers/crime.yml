# ── Official recorded-crime rates by district (ONS/Home Office) ──────────────
# The ONS "Recorded crime data by Community Safety Partnership area" workbook,
# Table C5: crime RATE per 1,000 population for headline offence groups, by
# local authority, year ending March 2024 — the latest published edition (the
# dataset is a twice-yearly xlsx, not an API, which is exactly what a tabular
# producer is for). One file serves the whole country; the engine's file cache
# downloads it once per deployment and both producers below read the same copy.
#
# Data honesty, learned from the file itself:
# - Rates are per 1,000 RESIDENTS at source — the population correction is the
#   publisher's, so these rank directly (unlike raw street-crime counts).
# - Cells the publisher does not fill arrive as bracketed shorthand ('[x]'/'[X]'
#   on the force and combined-CSP rows, '[u1]' for City of London's rates). The
#   producers map it to null: an honest gap, never a zero, never a string among
#   numbers.
# - Some CSPs publish only COMBINED districts (Devon, Kent, Worcestershire…);
#   the combined rows carry no LA code, so those member districts have no
#   individual row and a place there gets nothing from the keyed join.
# - Legacy CSP rows map onto merged LAs (Buckinghamshire appears as its four
#   old CSPs, East Suffolk as two), so a district code can carry MORE than one
#   row — each a real sub-area with its own real rate. Views label by name.
# - England and Wales only, like police.uk.

# Keyed by LA code, for the per-place join (UkPlace.districtCode).
- name: districtCrimeRates
  kind: tabular
  url: "https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/crimeandjustice/datasets/recordedcrimedatabycommunitysafetypartnershiparea/yearendingmarch2024/csptablesyemar24correction.xlsx"
  format: xlsx
  sheet: "Table C5"
  # Content-anchored header: the sheet carries a 7-row provenance banner, and
  # banners grow — a positional pin is wrong the day ONS adds a note.
  headerContains: "Local Authority code"
  keyColumn: "Local Authority code"
  keyMatch: ci
  rowIdAs: id
  userAgent: browser
  project:
    districtCode: "Local Authority code"
    district: "Local Authority name"
    csp: "Community Safety Partnership name"
    force: "Police Force Area name"
    population: "Population figures (mid-2022) - rounded to 100"
    households: "Household figures (mid-2021) - rounded to 100"
    totalRate: "Total recorded crime\n (excluding fraud)"
    violenceRate: "Violence against the person"
    violenceInjuryRate: "Violence with injury"
    stalkingRate: "Stalking and harassment"
    sexualRate: "Sexual offences"
    robberyRate: "Robbery"
    theftRate: "Theft offences"
    burglaryRate: "Burglary"
    vehicleRate: "Vehicle offences"
    theftFromPersonRate: "Theft from the person"
    bikeTheftRate: "Bicycle theft"
    shopliftingRate: "Shoplifting"
    criminalDamageRate: "Criminal damage and arson"
    drugRate: "Drug offences"
    weaponsRate: "Possession of weapons offences"
    publicOrderRate: "Public order offences"
  # ONS marks a cell it does not publish with bracketed shorthand — '[x]'/'[X]'
  # unavailable (the force and combined-CSP rows carry it in population,
  # households and every rate), '[u1]' for City of London's rates, whose resident
  # population is too small to divide by — and the reader keeps it as text.
  # Text in a numeric column is counted by count(), sorts ahead of every number,
  # and reads as a value; the shorthand means "no figure", so it lands as null.
  compute:
    population: "CASE WHEN toString(r.population) STARTS WITH '[' THEN null ELSE r.population END"
    households: "CASE WHEN toString(r.households) STARTS WITH '[' THEN null ELSE r.households END"
    totalRate: "CASE WHEN toString(r.totalRate) STARTS WITH '[' THEN null ELSE r.totalRate END"
    violenceRate: "CASE WHEN toString(r.violenceRate) STARTS WITH '[' THEN null ELSE r.violenceRate END"
    violenceInjuryRate: "CASE WHEN toString(r.violenceInjuryRate) STARTS WITH '[' THEN null ELSE r.violenceInjuryRate END"
    stalkingRate: "CASE WHEN toString(r.stalkingRate) STARTS WITH '[' THEN null ELSE r.stalkingRate END"
    sexualRate: "CASE WHEN toString(r.sexualRate) STARTS WITH '[' THEN null ELSE r.sexualRate END"
    robberyRate: "CASE WHEN toString(r.robberyRate) STARTS WITH '[' THEN null ELSE r.robberyRate END"
    theftRate: "CASE WHEN toString(r.theftRate) STARTS WITH '[' THEN null ELSE r.theftRate END"
    burglaryRate: "CASE WHEN toString(r.burglaryRate) STARTS WITH '[' THEN null ELSE r.burglaryRate END"
    vehicleRate: "CASE WHEN toString(r.vehicleRate) STARTS WITH '[' THEN null ELSE r.vehicleRate END"
    theftFromPersonRate: "CASE WHEN toString(r.theftFromPersonRate) STARTS WITH '[' THEN null ELSE r.theftFromPersonRate END"
    bikeTheftRate: "CASE WHEN toString(r.bikeTheftRate) STARTS WITH '[' THEN null ELSE r.bikeTheftRate END"
    shopliftingRate: "CASE WHEN toString(r.shopliftingRate) STARTS WITH '[' THEN null ELSE r.shopliftingRate END"
    criminalDamageRate: "CASE WHEN toString(r.criminalDamageRate) STARTS WITH '[' THEN null ELSE r.criminalDamageRate END"
    drugRate: "CASE WHEN toString(r.drugRate) STARTS WITH '[' THEN null ELSE r.drugRate END"
    weaponsRate: "CASE WHEN toString(r.weaponsRate) STARTS WITH '[' THEN null ELSE r.weaponsRate END"
    publicOrderRate: "CASE WHEN toString(r.publicOrderRate) STARTS WITH '[' THEN null ELSE r.publicOrderRate END"
  # A national statistical release: new twice a year. A week of politeness.
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 604800 }

