# Median pay for EVERY district in ONE NOMIS call (geography=TYPE434, the NOMIS
# set code for all local authorities — 371 obs), so crime-vs-income never fans
# out 300 keyed calls. The key itself is not sent: the geography is a fixed arg
# and the anchor literal just names the batch.
#
# The set still lists the 28 districts abolished in the 2020-23 reorganisations
# (Aylesbury Vale, Harrogate, Mendip…) with an empty value and status 'Q',
# "these figures are missing". They are not places any more, so they are not
# rows. Status 'B' — suppressed as statistically unreliable, City of London and
# the Isles of Scilly — is a real district with no published figure, and stays,
# its annualPay absent.
- name: medianPayAllDistricts
  kind: remote
  operation: medianPay
  records: "$.obs[?(@.obs_status.value != 'Q')]"
  keyTemplate: "{key}"
  echoKeyAs: key
  maxKeysPerCall: 1
  args:
    geography: "TYPE434"
    sex: "8"
    item: "2"
    pay: "7"
    measures: "20100"
    time: latest
  project:
    id: urn
    districtCode: geography.geogcode
    area: geography.description
    annualPay: obs_value.value
    year: time.description
  cache: { kind: ttl, seconds: 604800 }
