# anchor is literal-seeded: MATCH (s:IndicatorAcrossEngland {indicatorId:'10401'}).
# Every period and breakdown for the indicator comes back (~10k rows for a long
# series); the view keeps the headline row per area at the latest period.
- name: indicatorAcrossUpperTier
  kind: tabular
  url: "https://fingertips.phe.org.uk/api/all_data/csv/by_indicator_id?indicator_ids=90631,90632,10401,93203,93701,20401,20602,93085,20101,30309,41001,90366,92313,93562&child_area_type_id=502&parent_area_type_id=6"
