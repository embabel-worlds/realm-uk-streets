# ── The COMMUNITY axis: what a place-based data platform charts, read live ──
# The indicators community-data products curate and copy in — school readiness,
# youth justice, child poverty, NEET, teenage conceptions, childhood obesity,
# life expectancy, claimants, deprivation, population by age — every one is a
# keyless official release keyed on the GSS code UkPlace already stores. Nothing
# here is copied: each figure arrives with its publisher's own period, its
# "compared to England" judgement where the publisher makes one, and the fetch
# time as its as-at date.

# ── OHID Fingertips — the public-health indicator service ────────────────────
# One CSV per AREA TYPE for a fixed indicator set, keyed on the area's GSS code.
# 502 = upper-tier local authorities (unitaries, mets, London boroughs, counties)
# — where the children's-services indicators (school readiness, youth justice
# first-time entrants, NEET, children in low income) are published. 501 = lower-
# tier districts, where the health indicators also appear for two-tier districts.
# A unitary sits in BOTH files, so the two joins are not unioned — a view reads
# one edge or the other and says which.
#
# Data honesty, from the file itself:
# - One indicator carries MANY rows per area: every period, each sex, and
#   breakdowns (deprivation deciles, SEN) under `Category Type`. The headline
#   figure is the row with an EMPTY Category Type and Sex 'Persons' (or
#   'Female' for female-only indicators such as under-18 conceptions), latest
#   `Time period Sortable`. Views must filter that way or they double-count.
# - `Compared to England` is the PUBLISHER'S significance test ('Better',
#   'Worse', 'Similar', 'Not compared') — an honest "where this place stands
#   out", never a score of ours.
# - Polarity differs by indicator (a high school-readiness figure is good, a
#   high NEET figure is bad); the comparison column already encodes it.
- name: healthIndicatorsUpperTier
  kind: tabular
  url: "https://fingertips.phe.org.uk/api/all_data/csv/by_indicator_id?indicator_ids=90631,90632,10401,93203,93701,20401,20602,93085,20101,30309,41001,90366,92313,93562&child_area_type_id=502&parent_area_type_id=6"
  format: csv
  headerContains: "Indicator ID"
  keyColumn: "Area Code"
  keyMatch: ci
  keyAs: key
  rowIdAs: id
  userAgent: browser
  maxRows: 400000
  maxRowsPerKey: 3000
  project:
    indicatorId: "Indicator ID"
    indicator: "Indicator Name"
    areaCode: "Area Code"
    area: "Area Name"
    areaType: "Area Type"
    sex: "Sex"
    age: "Age"
    categoryType: "Category Type"
    category: "Category"
    period: "Time period"
    periodSortable: "Time period Sortable"
    value: "Value"
    lowerCi: "Lower CI 95.0 limit"
    upperCi: "Upper CI 95.0 limit"
    count: "Count"
    denominator: "Denominator"
    valueNote: "Value note"
    trend: "Recent Trend"
    comparedToEngland: "Compared to England value or percentiles"
    newData: "New data"
  # Indicators update on their own calendars, monthly at the fastest; a day.
  fileCacheSeconds: 86400
  cache: { kind: ttl, seconds: 86400 }

