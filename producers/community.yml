# ── NOMIS claimant count — the monthly labour-market pulse ───────────────────
# People claiming unemployment-related benefits, latest month, rounded to 5.
# Per place, keyed on the district code…
- name: claimantCount
  kind: remote
  operation: claimantCount
  records: "$.obs[*]"
  keyArg: geography
  echoKeyAs: key
  maxKeysPerCall: 1
  args:
    date: latest
    gender: "0"
    age: "0"
    measure: "1"
    measures: "20100"
  project:
    id: urn
    districtCode: geography.geogcode
    area: geography.description
    claimants: obs_value.value
    month: time.description
  # Monthly release; a day of cache.
  cache: { kind: ttl, seconds: 86400 }

# …and for EVERY local authority in ONE call (TYPE432 — the district/unitary set
# the claimant count is published on, 374 obs), the medianPayAllDistricts
# pattern: the key is not sent, the geography is a fixed arg, the anchor literal
# names the batch. Join to DistrictIncome/DistrictCrime on districtCode.
- name: claimantCountAllDistricts
  kind: remote
  operation: claimantCount
  records: "$.obs[*]"
  keyTemplate: "{key}"
  echoKeyAs: key
  maxKeysPerCall: 1
  args:
    geography: "TYPE432"
    date: latest
    gender: "0"
    age: "0"
    measure: "1"
    measures: "20100"
  project:
    id: urn
    districtCode: geography.geogcode
    area: geography.description
    claimants: obs_value.value
    month: time.description
  cache: { kind: ttl, seconds: 86400 }

# ── ONS mid-year population by age band ──────────────────────────────────────
# Five rows per place — all ages, 0-15, 16-64, 65+, 16-24 — so "how many
# children live here" and "what share is working age" are reads, and every
# per-head rate in the realm has a denominator with a year on it.
- name: populationByAge
  kind: remote
  operation: populationByAge
  records: "$.obs[*]"
  keyArg: geography
  echoKeyAs: key
  maxKeysPerCall: 1
  args:
    date: latest
    gender: "0"
    c_age: "200,201,203,209,250"
    measures: "20100"
  project:
    id: urn
    districtCode: geography.geogcode
    area: geography.description
    band: c_age.description
    persons: obs_value.value
    year: time.description
  # Annual estimate; a week.
  cache: { kind: ttl, seconds: 604800 }

# ── English Indices of Deprivation 2025 (MHCLG, published 30 Oct 2025) ───────
# File 10 v2: lower-tier district summaries on 2024 boundaries and LSOA 2021 —
# the CURRENT deprivation index. The 2019 edition stays in producers/
# deprivation.yml because the fitted crime model and its test fixtures are on
# it; this is the one to READ for a place today. Same polarity warning: higher
# score = more deprived, rank 1 = most deprived of 296 lower-tier districts.
# Header cells end in a trailing space in the sheet; the reader trims.
- name: imd2025DistrictSummary
  kind: tabular
  url: "https://assets.publishing.service.gov.uk/media/6917412ebc34c86ce4e6e7fc/File_10_-_IoD2025_Local_Authority_District_Summaries__lower-tier__v2.xlsx"
  format: xlsx
  sheet: "IMD"
  headerContains: "Local Authority District code"
  keyColumn: "Local Authority District code (2024)"
  keyMatch: ci
  keyAs: key
  rowIdAs: id
  userAgent: browser
  project:
    districtCode: "Local Authority District code (2024)"
    district: "Local Authority District name (2024)"
    averageScore: "IMD - Average score"
    rankOfAverageScore: "IMD - Rank of average score"
    averageRank: "IMD - Average rank"
    rankOfAverageRank: "IMD - Rank of average rank"
    proportionMostDeprived: "IMD - Proportion of LSOAs in most deprived 10% nationally"
    rankOfProportionMostDeprived: "IMD - Rank of proportion of LSOAs in most deprived 10% nationally"
    extent: "IMD25 - Extent"
    rankOfExtent: "IMD25 - Rank of extent"
    localConcentration: "IMD25 - Local concentration"
    rankOfLocalConcentration: "IMD25 - Rank of local concentration"
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 604800 }

