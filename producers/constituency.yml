# The CONSTITUENCY axis. Everything else in this realm is measured where the
# STATE administers — districts, force areas, LSOAs — and every one of those
# boundaries cuts across the one boundary a person actually recognises: their
# seat. NOMIS publishes ASHE at Westminster constituencies (TYPE172, the July
# 2024 boundaries), and the petitions site reports per-seat signatures on the
# SAME codes. Neither source knows the other exists; the join is the point.
#
# One call, every seat, no fan-out — the medianPayAllDistricts pattern: the key
# is not sent, the geography is a fixed arg, and the anchor literal just names
# the batch.
- name: medianPayAllConstituencies
  kind: remote
  operation: medianPay
  records: "$.obs[*]"
  keyTemplate: "{key}"
  echoKeyAs: key
  maxKeysPerCall: 1
  args:
    geography: "TYPE172"
    sex: "8"
    item: "2"
    pay: "7"
    measures: "20100"
    time: latest
  project:
    id: urn
    constituencyCode: geography.geogcode
    constituency: geography.description
    annualPay: obs_value.value
    year: time.description
  # ASHE is annual and the boundaries hold until the next review, so the figure
  # cannot move between two queries — this cache is politeness to NOMIS, not
  # freshness engineering, and a week of it serves every repeat read a
  # regression makes while somebody iterates on it.
  #
  # A week of TTL is the WHOLE cache story for a `remote` producer.
  # `fileCacheSeconds` is a TABULAR field — the content-addressed cache of a
  # downloaded spreadsheet — and setting it here failed the ENTIRE file's
  # parse, taking this producer with it while the realm still reported no
  # problems. The only symptom was `Unknown producer` at query time.
  cache: { kind: ttl, seconds: 604800 }

# Population density for EVERY district in ONE census call (TYPE154, the 2022
# local-authority set — 331 obs), so the national crime model gains an URBANITY
# axis without fanning out per district. Density is the variable the crime
# literature treats as dominant and this realm's model was missing: recorded
# crime concentrates where people, premises and opportunity concentrate.
- name: censusDensityAllDistricts
  kind: remote
  operation: censusDensity
  records: "$.obs[*]"
  keyTemplate: "{key}"
  echoKeyAs: key
  maxKeysPerCall: 1
  args:
    geography: "TYPE154"
    measures: "20100"
  project:
    id: urn
    districtCode: geography.geogcode
    area: geography.description
    density: obs_value.value
  # A decennial census behind a weekly cache — see the note above; `remote`
  # producers cache with TTL alone.
  cache: { kind: ttl, seconds: 604800 }

# The young-adult share of every district in ONE census call — the DEMOGRAPHIC
# axis of the national crime model. Criminology's most durable finding is the
# age-crime curve: offending peaks in late adolescence and early adulthood, so
# a district's age structure is a structural predictor independent of both its
# income and its urbanity. Band 5 (aged 20-24) as a PERCENTAGE, so no
# denominator arithmetic is needed downstream.
- name: censusYoungAdultsAllDistricts
  kind: remote
  operation: censusAgeStructure
  records: "$.obs[*]"
  keyTemplate: "{key}"
  echoKeyAs: key
  maxKeysPerCall: 1
  args:
    geography: "TYPE154"
    c2021_age_19: "5"
    measures: "20301"
  project:
    id: urn
    districtCode: geography.geogcode
    area: geography.description
    youngAdultPct: obs_value.value
  cache: { kind: ttl, seconds: 604800 }
