# Civic views: petitions and public contracts. The petition hop is 650 rows per
# petition — every view narrows the petitions BEFORE taking it.

- name: WhatBritainSigns
  description: The most-signed open petitions to Parliament right now — what the country is asking for, top of the list first.
  params:
    limit:
      type: int
      default: 10
      description: "How many petitions."
  cypher: |
    MATCH (f:PetitionFeed {state:'open'})-[:LISTS]->(pt:Petition)
    RETURN pt.action AS petition, toInteger(pt.signatures) AS signatures
    ORDER BY signatures DESC LIMIT $limit

- name: WhatMySeatsCareAbout
  description: The top open petitions' signature counts in YOUR constituencies — with a per-10,000-signature share so a small seat's passion reads beside a big one's. What each of your places' seats is asking Parliament for.
  params:
    petitions:
      type: int
      default: 6
      description: "How many top petitions to split by seat."
  cypher: |
    MATCH (p:UkPlace) WHERE p.constituencyCode IS NOT NULL
    WITH collect(DISTINCT p.constituencyCode) AS mine, collect(DISTINCT p.constituency)[0..9] AS names
    MATCH (f:PetitionFeed {state:'open'})-[:LISTS]->(pt:Petition)
    WITH mine, pt ORDER BY toInteger(pt.signatures) DESC LIMIT $petitions
    MATCH (pt)-[:HAS_SIGNATURES]->(cs:ConstituencySignal)
    WHERE cs.onsCode IN mine
    RETURN cs.constituency AS seat, pt.action AS petition,
           toInteger(cs.signatures) AS seatSignatures,
           toInteger(pt.signatures) AS nationwide,
           round(10000.0 * toInteger(cs.signatures) / toInteger(pt.signatures), 1) AS perTenThousand
    ORDER BY seat, seatSignatures DESC

- name: AwardsNearMyPlaces
  description: Contract awards from the last week (or the last `days`) whose winning supplier is REGISTERED in one of your places' outward postcode areas — where public money lands on your streets. Registered address, not delivery location; the window is fetched completely, day by day. With no places set up it answers empty without fetching anything.
  params:
    days:
      type: int
      default: 7
      description: "How many days back to read. Each day costs one or two calls to a source that allows twelve every two minutes, so a cold week takes about a minute and a cold month several."
  # `size(codes) > 0` is the guard that keeps an empty world off the feed: with no places the
  # collect still yields one row, and the window would be fetched only for every award to be
  # filtered out.
  cypher: |
    MATCH (p:UkPlace) WHERE p.outcode IS NOT NULL
    WITH collect(DISTINCT p.outcode) AS codes
    WHERE size(codes) > 0
    WITH codes,
         toString(datetime.truncate('day', datetime()) - duration({days: $days})) + '/' + toString(datetime.truncate('day', datetime())) AS win
    MATCH (w:AwardWindow {window: win})-[:PUBLISHED]->(c:ContractAward)
    WHERE any(oc IN codes WHERE c.supplierAddress CONTAINS (oc + ' '))
    RETURN c.supplier AS supplier, c.title AS contract, c.buyer AS buyer,
           toFloat(c.amount) AS amount, c.awardDate AS awarded, c.supplierAddress AS registeredAt
    ORDER BY amount DESC

# A WEEK BY DEFAULT, because the feed cannot sort by value: the largest awards are found only by
# reading every award in the window, one or two calls a day, against a source that allows twelve
# calls every two minutes. A week is about eleven calls — inside that allowance, so it answers in
# about a minute cold and from cache for six hours after. A month is forty-odd calls, meets the
# limit a third of the way in and takes several minutes; `days` asks for it deliberately.
- name: BiggestRecentAwards
  description: The largest UK contract awards published in the last week (or the last `days`), feed-wide — the recent public-spending headlines, fetched completely day by day.
  params:
    days:
      type: int
      default: 7
      description: "How many days back to read. A cold week takes about a minute; a cold month several, because the source allows twelve calls every two minutes."
    limit:
      type: int
      default: 15
      description: "How many awards, largest first."
  cypher: |
    WITH toString(datetime.truncate('day', datetime()) - duration({days: $days})) + '/' + toString(datetime.truncate('day', datetime())) AS win
    MATCH (w:AwardWindow {window: win})-[:PUBLISHED]->(c:ContractAward)
    RETURN c.title AS contract, c.buyer AS buyer, c.supplier AS supplier,
           toFloat(c.amount) AS amount, c.awardDate AS awarded
    ORDER BY amount DESC LIMIT $limit

- name: CareNearMyPlaces
  description: CQC-registered care locations in your places' outward postcode areas with their official ratings, worst first — needs the free CQC_SUBSCRIPTION_KEY; without it the warning names the missing credential.
  cypher: |
    MATCH (p:UkPlace)-[:HAS_CARE]->(c:CareLocation)
    RETURN p.name AS place, c.name AS location, c.rating AS rating, c.postcode AS postcode
    ORDER BY CASE c.rating WHEN 'Inadequate' THEN 0 WHEN 'Requires improvement' THEN 1 WHEN 'Good' THEN 2 WHEN 'Outstanding' THEN 3 ELSE 4 END

- name: WhoCaresAbout
  description: Which constituencies care most about a TOPIC — open petitions whose demand mentions it, summed per seat across all 650. Absolute signatures favour engaged seats; the per-seat view of one petition is WherePetitionIsHot.
  params:
    topic:
      type: string
      default: "animal"
      description: "A word or phrase to match in petition demands, e.g. 'animal', 'water', 'school'."
    limit:
      type: int
      default: 15
      description: "How many seats, most signatures first."
  cypher: |
    MATCH (f:PetitionFeed {state:'open'})-[:LISTS]->(pt:Petition)
    WHERE toLower(pt.action) CONTAINS toLower($topic)
    MATCH (pt)-[:HAS_SIGNATURES]->(cs:ConstituencySignal)
    WITH cs.constituency AS seat, cs.mp AS mp, sum(toInteger(cs.signatures)) AS signatures,
         collect(DISTINCT pt.action)[0..3] AS petitions
    RETURN seat, mp, signatures, petitions
    ORDER BY signatures DESC LIMIT $limit

- name: WherePetitionIsHot
  description: The reverse lens — pick a petition by a word from its demand and see which constituencies signed it most. Matches the most-signed open petition containing the phrase.
  params:
    petition:
      type: string
      default: "water"
      description: "A word or phrase from the petition's demand, e.g. 'water', 'surrogacy'."
    limit:
      type: int
      default: 15
      description: "How many seats, most signatures first."
  cypher: |
    MATCH (f:PetitionFeed {state:'open'})-[:LISTS]->(pt:Petition)
    WHERE toLower(pt.action) CONTAINS toLower($petition)
    WITH pt ORDER BY toInteger(pt.signatures) DESC LIMIT 1
    MATCH (pt)-[:HAS_SIGNATURES]->(cs:ConstituencySignal)
    RETURN pt.action AS petition, cs.constituency AS seat, cs.mp AS mp,
           toInteger(cs.signatures) AS signatures
    ORDER BY signatures DESC LIMIT $limit

- name: WhatMyPlacesCareAboutInBrief
  description: One row per seat — the three petitions with the strongest local backing (per-10,000 share of each petition's national signatures), rendered as a single plain sentence. When one cause clearly outstrips the runner-up (1.5x, computed in Cypher, never judged by the model) the sentence says so, in wording that varies by seat. One model call per seat.
  cypher: |
    MATCH (p:UkPlace) WHERE p.constituencyCode IS NOT NULL
    WITH collect(DISTINCT p.constituencyCode) AS mine
    MATCH (f:PetitionFeed {state:'open'})-[:LISTS]->(pt:Petition)
    WITH mine, pt ORDER BY toInteger(pt.signatures) DESC LIMIT 15
    MATCH (pt)-[:HAS_SIGNATURES]->(cs:ConstituencySignal)
    WHERE cs.onsCode IN mine
    WITH cs.constituency AS seat, pt.action AS action,
         toInteger(cs.signatures) AS sigs,
         10000.0 * toInteger(cs.signatures) / toInteger(pt.signatures) AS intensity
    ORDER BY seat, intensity DESC
    WITH seat, collect({action: action, intensity: intensity}) AS ranked, sum(sigs) AS localSignatures
    WITH seat, ranked, localSignatures,
         size(ranked) > 1 AND ranked[0].intensity >= 1.5 * ranked[1].intensity AS dominant,
         ['towers over everything else here', 'draws far more local signatures than any other cause',
          'leaves every other cause well behind', 'stands well clear of the rest'][size(seat) % 4] AS phrase
    UNWIND range(0, CASE WHEN size(ranked) < 3 THEN size(ranked) - 1 ELSE 2 END) AS i
    WITH seat, localSignatures, i,
         ranked[i].action + CASE WHEN i = 0 AND dominant THEN ', which ' + phrase ELSE '' END AS item
    ORDER BY seat, i
    RETURN seat,
           render(item, 'One sentence, 28 words or fewer if the items allow, plain voice, never the word because. The items are the causes local people sign petitions for, strongest first.', {ai: {punctuation: 'plain', hint: 'Never write a semicolon anywhere - use a comma or start a new short sentence instead.'}}) AS brief,
           localSignatures
    ORDER BY seat
