# Views over the official district crime table (DistrictCrime) and the
# all-districts pay batch (DistrictIncome). Rates here are the PUBLISHER'S
# per-1,000-population figures, so they rank directly — no density arithmetic.
# Every national view filters districtCode =~ '^[EW]0.*': the table also
# carries force-area subtotals and "Combined Local Authorities" rows.

- name: DistrictCrimeLeague
  description: "England & Wales districts ranked by official recorded crime per 1,000 residents (year ending March 2024), worst first — headline rate with violence, theft and shoplifting beside it. Westminster tops any such list partly because crimes are counted where they happen and residents where they live; say so when presenting. City of London is null (supplier data unavailable). For safest-first, order ascending on the raw type."
  params:
    limit:
      type: int
      default: 15
      description: "How many districts, worst first."
  cypher: |
    MATCH (u:UkDistricts {set:'england-and-wales'})-[:LISTS_CRIME]->(c:DistrictCrime)
    WHERE c.districtCode =~ '^[EW]0.*' AND toFloat(c.totalRate) IS NOT NULL
    RETURN c.district AS district, c.force AS force,
           round(toFloat(c.totalRate), 1) AS totalPer1000,
           round(toFloat(c.violenceRate), 1) AS violencePer1000,
           round(toFloat(c.theftRate), 1) AS theftPer1000,
           round(toFloat(c.shopliftingRate), 1) AS shopliftingPer1000
    ORDER BY totalPer1000 DESC LIMIT $limit

- name: DistrictCrimeAtMyPlaces
  description: "The official recorded-crime rates for each watched place's local authority (per 1,000 residents, year ending March 2024) — the district-wide complement to the 1-mile street view. A place in a merged authority (Buckinghamshire, East Suffolk) shows one row per legacy sub-area; a place whose district publishes only combined figures (parts of Devon, Kent, Worcestershire) shows none."
  params:
    limit:
      type: int
      default: 30
      description: "Maximum place rows."
  cypher: |
    MATCH (p:UkPlace)-[:HAS_DISTRICT_CRIME]->(c:DistrictCrime)
    RETURN p.name AS place, c.district AS district, c.csp AS area,
           round(toFloat(c.totalRate), 1) AS totalPer1000,
           round(toFloat(c.violenceRate), 1) AS violencePer1000,
           round(toFloat(c.burglaryRate), 1) AS burglaryPer1000,
           round(toFloat(c.vehicleRate), 1) AS vehiclePer1000,
           round(toFloat(c.shopliftingRate), 1) AS shopliftingPer1000
    ORDER BY totalPer1000 DESC LIMIT $limit

- name: CrimeVsIncomeAcrossDistricts
  description: "Every district's official crime rate beside its median full-time pay — the national cross-section (roughly 290 districts), poorest first, so the association is visible as you read down. Crime is per 1,000 residents (year ending March 2024); pay is ASHE median gross annual pay. Association across areas, not causation, and not a claim about anyone."
  params:
    limit:
      type: int
      default: 300
      description: "Maximum district rows (the whole cross-section by default)."
  cypher: |
    MATCH (u:UkDistricts {set:'england-and-wales'})-[:LISTS_CRIME]->(c:DistrictCrime)
    WHERE c.districtCode =~ '^[EW]0.*'
    MATCH (u)-[:HAS_PAY]->(i:DistrictIncome)
    WHERE i.districtCode = c.districtCode
    WITH c, toFloat(i.annualPay) AS pay
    WHERE pay IS NOT NULL AND toFloat(c.totalRate) IS NOT NULL
    RETURN c.district AS district, pay AS medianAnnualPay,
           round(toFloat(c.totalRate), 1) AS totalPer1000,
           round(toFloat(c.violenceRate), 1) AS violencePer1000
    ORDER BY pay ASC LIMIT $limit

# Requires an engine with the deterministic numeric aggregations (correlate /
# regress). On an older engine this view errors with an unknown function —
# the row views above carry the same data either way.
- name: WhatTracksDistrictCrime
  description: "What are the best PREDICTORS of crime — 'what drives crime', 'run a regression on crime', 'which factors explain crime levels'? One statistical answer over the whole England & Wales district cross-section: the pay–crime correlation, and a least-squares fit of the crime rate on median pay and population, standardized betas ranking the predictors, with the districts most above and below their prediction by name. Asked per constituency or per area, the DISTRICT is the statistical unit the sources share. Deterministic arithmetic over official figures — association across areas, never causation, and Westminster's daytime-population inflation applies."
  cypher: |
    MATCH (u:UkDistricts {set:'england-and-wales'})-[:LISTS_CRIME]->(c:DistrictCrime)
    WHERE c.districtCode =~ '^[EW]0.*'
    MATCH (u)-[:HAS_PAY]->(i:DistrictIncome)
    WHERE i.districtCode = c.districtCode
    RETURN correlate(toFloat(i.annualPay), toFloat(c.totalRate)) AS payVsCrime,
           regress([toFloat(i.annualPay), toFloat(c.population)], toFloat(c.totalRate), c.district) AS model

# The question this realm exists to answer, asked properly: not "does money
# track crime" (one variable, and the answer is barely) but "of everything we
# can JOIN, what actually predicts it". Three registers that do not know each
# other — ONS recorded crime, NOMIS ASHE pay, Census 2021 density — meeting on
# the district code.
- name: WhatBestPredictsCrime
  description: "What is the best PREDICTOR of recorded crime across England — deprivation, urbanity, income, age structure, ethnic diversity, or population? A least-squares fit of each district's crime rate — offences per 1,000 RESIDENTS, the publisher's own per-capita figure, so this is not a population-size artefact — on median pay, population density, the share of residents aged 20-24, IoD2019 deprivation, ethnic DIVERSITY (an index over the whole composition — the chance two residents drawn at random belong to different groups, never any single group's share) and population together, with STANDARDIZED betas so all six are directly comparable, honest R², and the districts furthest above and below their prediction by name. Joins six registers on the district code: ONS recorded crime, NOMIS ASHE pay, Census 2021 density, Census 2021 age structure, Census 2021 ethnic composition, MHCLG IoD2019. England only once deprivation is in the fit — Wales measures deprivation on a separate, non-comparable index. Read a beta as strength of association ACROSS AREAS: it is a statement about places, never about the people in them, and a variable that looks strong alone and weak here had its apparent effect belonging to a variable it travels with. Two warnings the numbers cannot carry: recorded crime counts where offences HAPPEN and residents where they LIVE, which inflates city-centre and retail districts (Westminster above all); and R² here is modest by design — the joinable open data holds economic and structural variables, not the policing, reporting and opportunity factors that drive much of the remainder."
  cypher: |
    MATCH (u:UkDistricts {set:'england-and-wales'})-[:LISTS_CRIME]->(c:DistrictCrime)
    WHERE c.districtCode =~ '^[EW]0.*'
    MATCH (u)-[:HAS_PAY]->(i:DistrictIncome)
    WHERE i.districtCode = c.districtCode
    MATCH (u)-[:HAS_DENSITY_STAT]->(d:DistrictDensity)
    WHERE d.districtCode = c.districtCode
    MATCH (u)-[:HAS_AGE_STRUCTURE]->(y:DistrictYoungAdults)
    WHERE y.districtCode = c.districtCode
    MATCH (u)-[:HAS_DEPRIVATION]->(dep:DistrictDeprivation)
    WHERE dep.districtCode = c.districtCode
    // Ethnic MIX as a diversity index, computed from the whole composition:
    // 1 - the sum of squared shares is the chance two residents drawn at
    // random belong to different groups. Five rows per district collapse to
    // one number here, which is why this is a WITH and not another MATCH.
    MATCH (u)-[:HAS_ETHNIC_GROUP]->(g:DistrictEthnicGroup)
    WHERE g.districtCode = c.districtCode
    WITH c, i, d, y, dep,
         1.0 - sum((toFloat(g.percent) / 100.0) * (toFloat(g.percent) / 100.0)) AS diversity
    RETURN regress(
             [toFloat(i.annualPay), toFloat(d.density), toFloat(y.youngAdultPct),
              toFloat(dep.imdAverageScore), diversity, toFloat(c.population)],
             toFloat(c.totalRate),
             c.district
           ) AS model

# The same three predictors taken ONE at a time, so the multi-variable betas
# above can be read against what each variable claims on its own — the gap
# between them IS the confounding.
- name: CrimePredictorsOneByOne
  description: "Each candidate predictor of district crime measured ALONE — deprivation, density, the 20-24 share, ethnic diversity, pay and population each correlated with the crime rate on its own, with a confidence interval and whether the association is DETECTABLE. Read beside WhatBestPredictsCrime: a variable that looks strong here and weak there is one whose apparent effect belonged to a variable it travels with. Association across areas, never causation."
  cypher: |
    MATCH (u:UkDistricts {set:'england-and-wales'})-[:LISTS_CRIME]->(c:DistrictCrime)
    WHERE c.districtCode =~ '^[EW]0.*'
    MATCH (u)-[:HAS_PAY]->(i:DistrictIncome)
    WHERE i.districtCode = c.districtCode
    MATCH (u)-[:HAS_DENSITY_STAT]->(d:DistrictDensity)
    WHERE d.districtCode = c.districtCode
    MATCH (u)-[:HAS_AGE_STRUCTURE]->(y:DistrictYoungAdults)
    WHERE y.districtCode = c.districtCode
    MATCH (u)-[:HAS_DEPRIVATION]->(dep:DistrictDeprivation)
    WHERE dep.districtCode = c.districtCode
    MATCH (u)-[:HAS_ETHNIC_GROUP]->(g:DistrictEthnicGroup)
    WHERE g.districtCode = c.districtCode
    WITH c, i, d, y, dep,
         1.0 - sum((toFloat(g.percent) / 100.0) * (toFloat(g.percent) / 100.0)) AS diversity
    WITH toFloat(c.totalRate) AS crime, toFloat(i.annualPay) AS pay,
         toFloat(d.density) AS density, toFloat(y.youngAdultPct) AS youngAdults,
         toFloat(dep.imdAverageScore) AS deprivation, diversity,
         toFloat(c.population) AS population
    RETURN correlate(deprivation, crime) AS deprivationVsCrime,
           correlate(density, crime) AS densityVsCrime,
           correlate(youngAdults, crime) AS youngAdultsVsCrime,
           correlate(diversity, crime) AS diversityVsCrime,
           correlate(pay, crime) AS payVsCrime,
           correlate(population, crime) AS populationVsCrime

# The model the crime-predictors app drives: WHICH predictors are in the fit is
# the caller's choice, so a person can add one and watch what it does to the
# others. That is the whole finding — a variable's apparent strength belongs to
# the variables it travels with — and it cannot be shown by any single model.
#
# EVERY hop is a required MATCH, deliberately: the district set is therefore the
# SAME 263 for every combination of flags, so a beta that moves moved because the
# MODEL changed and not because the sample did. Toggling deprivation off does not
# readmit the Welsh districts it excludes; holding n constant is what makes the
# before/after comparison honest.
#
# `regress` names positional predictors x1..xn over a computed list, so a caller
# maps them back by the fixed order below: deprivation, density, youngAdults,
# pay, diversity, population.
- name: CrimeModelWithPredictors
  description: "A least-squares fit of district crime rate on WHICHEVER of the six predictors the caller enables — deprivation, population density, the 20-24 share, median pay, ethnic diversity and population — with standardized betas, R², and the districts furthest above and below prediction. Enabling exactly one gives that predictor's association measured ALONE (a solo standardized beta is its correlation), so the same view answers 'what does this variable claim by itself' and 'what survives beside the others', which is the comparison that matters. The district set is identical for every combination (263, England only, since deprivation is England-only), so a beta that moves moved because the model changed, not the sample. Predictors are returned as x1..xn in this fixed order: deprivation, density, youngAdults, pay, diversity, population. Association across areas, never causation, and never a statement about any person."
  params:
    deprivation: { type: boolean, default: true, description: "Include IoD2019 average deprivation score." }
    density: { type: boolean, default: true, description: "Include Census 2021 population density." }
    youngAdults: { type: boolean, default: true, description: "Include the share of residents aged 20-24." }
    pay: { type: boolean, default: true, description: "Include ASHE median annual pay." }
    diversity: { type: boolean, default: true, description: "Include the ethnic diversity index (never a single group's share)." }
    population: { type: boolean, default: true, description: "Include resident population." }
  cypher: |
    MATCH (u:UkDistricts {set:'england-and-wales'})-[:LISTS_CRIME]->(c:DistrictCrime)
    WHERE c.districtCode =~ '^[EW]0.*'
    MATCH (u)-[:HAS_PAY]->(i:DistrictIncome)
    WHERE i.districtCode = c.districtCode
    MATCH (u)-[:HAS_DENSITY_STAT]->(d:DistrictDensity)
    WHERE d.districtCode = c.districtCode
    MATCH (u)-[:HAS_AGE_STRUCTURE]->(y:DistrictYoungAdults)
    WHERE y.districtCode = c.districtCode
    MATCH (u)-[:HAS_DEPRIVATION]->(dep:DistrictDeprivation)
    WHERE dep.districtCode = c.districtCode
    MATCH (u)-[:HAS_ETHNIC_GROUP]->(g:DistrictEthnicGroup)
    WHERE g.districtCode = c.districtCode
    WITH c, i, d, y, dep,
         1.0 - sum((toFloat(g.percent) / 100.0) * (toFloat(g.percent) / 100.0)) AS diversity
    // EVERY predictor non-null, whether or not it is enabled. Without this the sample
    // moves with the toggles — `regress` drops a row whose enabled predictors contain a
    // null, so turning pay off readmitted the districts pay was missing for and n went
    // 263 -> 271. A beta that changed would then be confounded by the sample changing,
    // which is the exact mistake this view exists to let someone see.
    WHERE toFloat(dep.imdAverageScore) IS NOT NULL AND toFloat(d.density) IS NOT NULL
      AND toFloat(y.youngAdultPct) IS NOT NULL AND toFloat(i.annualPay) IS NOT NULL
      AND diversity IS NOT NULL AND toFloat(c.population) IS NOT NULL
    WITH c, [x IN [
           CASE WHEN $deprivation THEN toFloat(dep.imdAverageScore) END,
           CASE WHEN $density     THEN toFloat(d.density) END,
           CASE WHEN $youngAdults THEN toFloat(y.youngAdultPct) END,
           CASE WHEN $pay         THEN toFloat(i.annualPay) END,
           CASE WHEN $diversity   THEN diversity END,
           CASE WHEN $population  THEN toFloat(c.population) END
         ] WHERE x IS NOT NULL] AS predictors
    RETURN regress(predictors, toFloat(c.totalRate), c.district) AS model

# The places behind the model. A coefficient is an argument about districts in
# general; this is the districts themselves, so a reader can find somewhere they
# know and see where it sits on every axis the model uses.
- name: DistrictsRanked
  description: "Every English district in the crime model, worst crime rate first, with the value of each predictor beside it — deprivation, density, the 20-24 share, median pay and ethnic diversity. The same 263 districts and the same figures the model fits, so a reader can find a place they know and see where it actually sits rather than taking the coefficients on trust. Crime is offences per 1,000 residents (ONS, year ending March 2024); Westminster's is inflated by its daytime population."
  params:
    limit:
      type: int
      default: 300
      description: "How many districts, worst crime first (the whole set by default)."
  cypher: |
    MATCH (u:UkDistricts {set:'england-and-wales'})-[:LISTS_CRIME]->(c:DistrictCrime)
    WHERE c.districtCode =~ '^[EW]0.*'
    MATCH (u)-[:HAS_PAY]->(i:DistrictIncome)
    WHERE i.districtCode = c.districtCode
    MATCH (u)-[:HAS_DENSITY_STAT]->(d:DistrictDensity)
    WHERE d.districtCode = c.districtCode
    MATCH (u)-[:HAS_AGE_STRUCTURE]->(y:DistrictYoungAdults)
    WHERE y.districtCode = c.districtCode
    MATCH (u)-[:HAS_DEPRIVATION]->(dep:DistrictDeprivation)
    WHERE dep.districtCode = c.districtCode
    MATCH (u)-[:HAS_ETHNIC_GROUP]->(g:DistrictEthnicGroup)
    WHERE g.districtCode = c.districtCode
    WITH c, i, d, y, dep,
         1.0 - sum((toFloat(g.percent) / 100.0) * (toFloat(g.percent) / 100.0)) AS diversity
    WHERE toFloat(dep.imdAverageScore) IS NOT NULL AND toFloat(d.density) IS NOT NULL
      AND toFloat(y.youngAdultPct) IS NOT NULL AND toFloat(i.annualPay) IS NOT NULL
      AND diversity IS NOT NULL AND toFloat(c.population) IS NOT NULL
    RETURN c.district AS district,
           round(toFloat(c.totalRate), 1) AS crimePer1000,
           round(toFloat(dep.imdAverageScore), 1) AS deprivation,
           toInteger(d.density) AS density,
           toFloat(y.youngAdultPct) AS youngAdultPct,
           toInteger(i.annualPay) AS annualPay,
           round(diversity, 3) AS diversity
    ORDER BY crimePer1000 DESC
    LIMIT $limit
