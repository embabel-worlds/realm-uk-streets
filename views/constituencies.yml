# The CONSTITUENCY cross-section — the boundary a person recognises as theirs.
#
# Every other national view in this realm is per DISTRICT, because that is where
# the state publishes crime. These are per SEAT, because that is where NOMIS
# publishes pay and where the petitions site reports signatures — on the SAME
# July 2024 GSS codes, with neither source aware of the other. The join is the
# whole point: each half is a published table nobody would look twice at, and
# together they answer a question neither publisher can.

- name: PayAcrossConstituencies
  description: "Median full-time annual pay for every Westminster constituency (ASHE, July 2024 boundaries), richest first — the national per-seat economic cross-section in one NOMIS call. Great Britain only: the 18 Northern Ireland seats are absent from ASHE. Pay is measured where the JOB is, not where the worker lives, so commuter seats read high."
  params:
    limit:
      type: int
      default: 650
      description: "How many seats to return, highest pay first (the whole cross-section by default)."
  cypher: |
    MATCH (u:UkConstituencies {set:'westminster-2024'})-[:HAS_CONSTITUENCY_PAY]->(cp:ConstituencyPay)
    WHERE toFloat(cp.annualPay) IS NOT NULL
    RETURN cp.constituency AS constituency, cp.constituencyCode AS constituencyCode,
           toFloat(cp.annualPay) AS annualPay, cp.year AS year
    ORDER BY annualPay DESC
    LIMIT $limit

# ── The cross-source join ────────────────────────────────────────────────────
# The petitions site publishes, for each live petition, how many people in each
# of the 650 seats signed it. It knows nothing about those seats. NOMIS
# publishes what each seat earns. It knows nothing about petitions. Joined on
# the GSS code, the pair answers a question neither can: does what a place
# EARNS predict what it ASKS PARLIAMENT FOR?
#
# NOTE for anyone extending these: correlate/regress are AGGREGATES over rows,
# finalized in the RETURN projection. In a WITH they type-check, compute
# nothing, and hand back null — which reads as "no association" when it means
# "not computed". Keep them in the RETURN.
#
# THE JOIN IS A LOOKUP, NOT A SECOND MATCH. The pay rows and the signature rows
# are each fetched through their own door, and matched side by side with
# `WHERE cp.constituencyCode = cs.onsCode` the engine walks every pairing before
# the WHERE drops all but one: 25 petitions x 650 seats x 631 pay rows is ten
# million candidates, and the statement runs out of its twenty-million-step work
# budget and answers nothing. So each body reads pay ONCE into a list of
# {code, pay} (631 entries), narrows the petitions BEFORE the 650-seat hop, and
# looks each seat's pay up in that list — the match work is the two fetches and
# nothing more.
- name: PayVsPetitionSigning
  description: "Does a seat's PAY predict how hard it signs a petition? For every live petition, the correlation across all 631 constituencies between what the seat earns (NOMIS ASHE) and how many people there signed (the petitions site's per-seat map) — with a confidence interval and whether the association is DETECTABLE at all, so a flat result reads as flat rather than as a small effect. A negative r means poorer seats signed harder. Joins two registers on the shared July 2024 GSS code; neither publisher holds the other's half. Association across seats, never causation, and signatures are a self-selecting sample of petition-site users, which skews by age and internet access as well as by money."
  params:
    limit:
      type: int
      default: 25
      description: "How many live petitions to analyse, most-signed first (the feed's top page by default)."
  cypher: |
    MATCH (u:UkConstituencies {set:'westminster-2024'})-[:HAS_CONSTITUENCY_PAY]->(cp:ConstituencyPay)
    WHERE toFloat(cp.annualPay) IS NOT NULL
    WITH collect({code: cp.constituencyCode, pay: toFloat(cp.annualPay)}) AS pays
    MATCH (f:PetitionFeed {state:'open'})-[:LISTS]->(pt:Petition)
    WITH pays, pt ORDER BY toInteger(pt.signatures) DESC LIMIT $limit
    MATCH (pt)-[:HAS_SIGNATURES]->(cs:ConstituencySignal)
    WITH pt, cs, [r IN pays WHERE r.code = cs.onsCode | r.pay] AS seatPay
    WHERE size(seatPay) > 0
    WITH pt, seatPay[0] AS pay, toFloat(cs.signatures) AS sigs
    RETURN pt.action AS petition,
           toInteger(pt.signatures) AS nationalSignatures,
           count(*) AS seatsMatched,
           correlate(pay, sigs) AS payVsSignatures
    ORDER BY nationalSignatures DESC

# The same join read as a league table rather than a coefficient: which seats
# actually back each cause, and what do they earn?
- name: WhatPoorSeatsAskFor
  description: "For each of the most-signed live petitions, the average pay of the 20 constituencies that signed it HARDEST against the 20 that signed it least — the class gradient of what Britain asks Parliament for, in pounds rather than a coefficient. Joins the petitions site's per-seat signature map to NOMIS ASHE pay on the shared July 2024 GSS code. For whether a gap is statistically detectable at all, use PayVsPetitionSigning; a 20-seat contrast always produces two numbers, even when the relation is noise."
  params:
    petitions:
      type: int
      default: 6
      description: "How many of the most-signed live petitions to analyse."
  cypher: |
    MATCH (u:UkConstituencies {set:'westminster-2024'})-[:HAS_CONSTITUENCY_PAY]->(cp:ConstituencyPay)
    WHERE toFloat(cp.annualPay) IS NOT NULL
    WITH collect({code: cp.constituencyCode, pay: toFloat(cp.annualPay)}) AS pays
    MATCH (f:PetitionFeed {state:'open'})-[:LISTS]->(pt:Petition)
    WITH pays, pt ORDER BY toInteger(pt.signatures) DESC LIMIT $petitions
    MATCH (pt)-[:HAS_SIGNATURES]->(cs:ConstituencySignal)
    WITH pt, cs, [r IN pays WHERE r.code = cs.onsCode | r.pay] AS seatPay
    WHERE size(seatPay) > 0
    WITH pt, cs, seatPay[0] AS pay, toFloat(cs.signatures) AS sigs
    // Signature-ordered BEFORE the collect, so the head of the list is the seats that
    // signed hardest and the tail the ones that signed least.
    ORDER BY sigs DESC
    WITH pt, collect({seat: cs.constituency, pay: pay, sigs: sigs}) AS seats
    // Both ends of every range are stated: an open-ended `list[-20..]` cannot be
    // parsed by the scope rewriter, so it can never be safely scoped and is refused.
    WITH pt, seats, size(seats) AS n
    WITH pt, seats, n,
         [x IN seats[0..20] | x.pay] AS topPay,
         [x IN seats[(n - 20)..n] | x.pay] AS bottomPay
    RETURN pt.action AS petition,
           toInteger(pt.signatures) AS nationalSignatures,
           n AS seatsMatched,
           round(reduce(t = 0.0, p IN topPay | t + p) / size(topPay)) AS payOfKeenestSeats,
           round(reduce(t = 0.0, p IN bottomPay | t + p) / size(bottomPay)) AS payOfCoolestSeats,
           [x IN seats[0..5] | x.seat] AS keenestSeats,
           [x IN seats[(n - 5)..n] | x.seat] AS coolestSeats
    ORDER BY nationalSignatures DESC

# The same join asked as a MODEL: across every seat, what does pay predict
# about how hard that seat signs — and which seats does pay fail to explain?
- name: WhatPredictsSeatSigning
  description: "A least-squares fit, across all 631 constituencies, of how hard each seat signed the single most-signed live petition on what that seat EARNS — standardized beta, honest R², and the seats furthest above and below their prediction by name. The residuals are the interesting half: a seat signing far harder than its pay predicts is telling you something pay cannot explain. Joins petition signatures to NOMIS ASHE pay on the shared GSS code. Association across seats, never causation; signatures are a self-selecting sample."
  cypher: |
    MATCH (u:UkConstituencies {set:'westminster-2024'})-[:HAS_CONSTITUENCY_PAY]->(cp:ConstituencyPay)
    WHERE toFloat(cp.annualPay) IS NOT NULL
    WITH collect({code: cp.constituencyCode, pay: toFloat(cp.annualPay)}) AS pays
    MATCH (f:PetitionFeed {state:'open'})-[:LISTS]->(pt:Petition)
    WITH pays, pt ORDER BY toInteger(pt.signatures) DESC LIMIT 1
    MATCH (pt)-[:HAS_SIGNATURES]->(cs:ConstituencySignal)
    WITH pt, cs, [r IN pays WHERE r.code = cs.onsCode | r.pay] AS seatPay
    WHERE size(seatPay) > 0
    WITH pt, cs, seatPay[0] AS annualPay
    RETURN pt.action AS petition,
           regress([annualPay], toFloat(cs.signatures), cs.constituency) AS model
