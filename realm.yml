name: realm-uk-streets
description: |
  Street-level Britain, joined at a place: police-recorded crime, every
  registered property sale since 1995, the House Price Index, ONS median pay,
  Census 2021 ethnicity, schools, food-hygiene ratings, live flood alerts,
  and each place's MP with the seat's latest margin — ten keyless official
  sources queryable as one graph, anchored on `UkPlace`s you watch at two
  zoom levels (a full postcode for street level, an outcode for the district).
  Cross-source views answer what no single register can: CrimeVsIncome,
  IncomeByParty, SeatsAndMargins, PriceTrendAtMyPlaces, WhereNotToEat,
  PlaceDossier. The Street Lens app (`apps/street-lens.html`) puts it all on
  a map of Britain — a dossier per dot.

  No API keys and no accounts — the realm works the moment it is installed.
